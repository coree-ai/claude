name: Verify Plugin Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace schema
        run: claude plugin validate .

      - name: Add marketplace from local checkout
        run: claude plugin marketplace add ./

      - name: Verify marketplace is registered
        run: |
          claude plugin marketplace list --json | grep '"name": "coree"'
